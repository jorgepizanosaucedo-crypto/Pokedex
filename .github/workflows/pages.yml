# Compila la versión web y la publica en GitHub Pages en cada push a main.
#
# Una sola vez: en el repositorio, Settings → Pages → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos push seguidos, sólo se publica el último.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # La página vive en https://<usuario>.github.io/<repositorio>/, así que
      # la app necesita saber esa subcarpeta. Si el repositorio se llama
      # <usuario>.github.io, va en la raíz.
      - name: Compilar la versión web
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE="/"; else BASE="/$REPO/"; fi
          # --wasm: WebAssembly en los navegadores que lo soportan (más fluido en
          # el teléfono); los demás cargan solos la versión en JavaScript.
          flutter build web --release --wasm --base-href "$BASE"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
