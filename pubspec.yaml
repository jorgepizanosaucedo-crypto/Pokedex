name: pokedex_app
description: "Pokédex - Flutter consumiendo la PokeAPI con Dio (Actividad 12)."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  audioplayers: ^6.8.1
  cached_network_image: ^4.0.4
  # Ya venía con cached_network_image; se declara para poder vaciar la caché
  # de imágenes en disco desde el perfil.
  flutter_cache_manager: ^3.4.5
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  # Web Audio para los efectos en el navegador (ver services/sfx/).
  web: ^1.1.1
  # Firebase (proyecto pokedex-jorge): cuentas de entrenador y datos en la
  # nube. La configuración está en lib/firebase_options.dart.
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/music/
    - assets/mascota/

  # Poppins empaquetada (recortada al alfabeto latino, ~140 KB): antes se
  # descargaba de Google Fonts al abrir y el texto tardaba en aparecer.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
